<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:appButton="jakarta.faces.composite/appButton"
      xmlns:dataTable="jakarta.faces.composite/dataTable">
    <h:head>
        <title>Data Table Component Example</title>
    </h:head>
    <h:body>
        <h1>Data Table</h1>

        <h:form>
            <div class="data-table-example-card">
                <h5>Timesheets</h5>
                <dataTable:dataTable value="#{dataTableExampleBean.timesheets}"
                                     rowKey="#{row.id}"
                                     rows="5"
                                     emptyMessage="No timesheets found">
                    <p:column headerText="ID" sortBy="#{row.id}">
                        <h:outputText value="#{row.id}"/>
                    </p:column>
                    <p:column headerText="Contract" sortBy="#{row.contractId}">
                        <h:outputText value="#{row.contractId}"/>
                    </p:column>
                    <p:column headerText="Start date" sortBy="#{row.startDate}">
                        <h:outputText value="#{row.startDate}"/>
                    </p:column>
                    <p:column headerText="End date" sortBy="#{row.endDate}">
                        <h:outputText value="#{row.endDate}"/>
                    </p:column>
                    <p:column headerText="Status"
                              sortBy="#{row.status}"
                              filterBy="#{row.status}">
                        <h:outputText value="#{row.status}"/>
                    </p:column>
                    <p:column headerText="Actions">
                        <appButton:appButton value="View"
                                                   icon="pi pi-search"
                                                   outcome="/component-examples/dataTable"
                                                   styleClass="ui-button-sm"/>
                    </p:column>
                </dataTable:dataTable>
            </div>
        </h:form>
    </h:body>
</html>
