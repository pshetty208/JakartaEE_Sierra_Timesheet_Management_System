<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:dashboardMetric="jakarta.faces.composite/dashboardMetric">
    <h:head>
        <title>Dashboard Metric Component Example</title>
        <h:outputStylesheet library="appTheme" name="appTheme.css"/>
        <style>
            .metric-example { display: grid; grid-template-columns: repeat(3, minmax(0, 14rem)); gap: 1rem; }
        </style>
    </h:head>
    <h:body>
        <h1>Dashboard Metric</h1>
        <div class="metric-example">
            <dashboardMetric:dashboardMetric label="Pending approval" value="5"
                                                 icon="pi pi-inbox" tone="accent"/>
            <dashboardMetric:dashboardMetric label="Signed this month" value="8"
                                                 icon="pi pi-check-circle" tone="positive"/>
            <dashboardMetric:dashboardMetric label="Active contracts" value="4"
                                                 icon="pi pi-file"/>
        </div>
    </h:body>
</html>
