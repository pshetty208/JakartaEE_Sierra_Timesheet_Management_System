<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="jakarta.faces.core"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:headerbar="jakarta.faces.composite/headerbar"
      xmlns:userProfileMenu="jakarta.faces.composite/userProfileMenu">
    <h:head>
        <title>Headerbar Component Example</title>
    </h:head>
    <h:body>
        <h:form styleClass="app-headerbar__form">
            <headerbar:headerbar>
                <f:facet name="start">
                    <h:panelGroup layout="block" styleClass="app-headerbar__brand">
                        <span class="app-headerbar__brand-mark">S</span>
                        <span>Sierra TMS</span>
                    </h:panelGroup>
                </f:facet>

                <f:facet name="end">
                    <h:panelGroup layout="block" styleClass="app-headerbar__actions">
                        <span class="ui-input-icon-left">
                            <i class="pi pi-fw pi-search"></i>
                            <p:inputText styleClass="app-headerbar__search" placeholder="Search"/>
                        </span>
                        <userProfileMenu:userProfileMenu name="Prajna Shetty"
                                                         subtitle="Project Admin"
                                                         label="PS">
                            <p:submenu label="Account">
                                <p:menuitem value="Profile" outcome="/component-examples/userProfileMenu" icon="pi pi-user"/>
                                <p:menuitem value="Preferences" url="#" icon="pi pi-cog"/>
                            </p:submenu>
                            <p:submenu label="Session">
                                <p:menuitem value="Logout" url="#" icon="pi pi-sign-out"/>
                            </p:submenu>
                        </userProfileMenu:userProfileMenu>
                    </h:panelGroup>
                </f:facet>
            </headerbar:headerbar>
        </h:form>
    </h:body>
</html>
