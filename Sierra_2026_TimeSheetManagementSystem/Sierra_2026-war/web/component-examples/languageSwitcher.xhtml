<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="jakarta.faces.core"
      xmlns:h="jakarta.faces.html"
      xmlns:languageSwitcher="jakarta.faces.composite/languageSwitcher">
    <f:view locale="#{localeBean.locale}">
        <f:loadBundle basename="sierra.tms.i18n.messages" var="msg"/>

        <h:head>
            <title>Language Switcher Component Example</title>
        </h:head>
        <h:body>
            <h1>Language Switcher</h1>

            <h2>Default</h2>
            <languageSwitcher:languageSwitcher condensed="false"/>

            <h2>Condensed</h2>
            <languageSwitcher:languageSwitcher condensed="true"/>

            <h2>#{msg['welcome']}</h2>
            <p>The heading above changes when a language is selected.</p>
        </h:body>
    </f:view>
</html>
