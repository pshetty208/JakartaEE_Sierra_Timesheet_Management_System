<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:appButton="jakarta.faces.composite/appButton">
    <h:head>
        <title>Button Component Example</title>
        <h:outputStylesheet library="appTheme" name="appTheme.css"/>
        <h:outputStylesheet library="appLayout" name="appLayout.css"/>
        <h:outputStylesheet library="componentExamples" name="componentExamples.css"/>
        <h:outputScript library="appTheme" name="appTheme.js" target="head"/>
    </h:head>
    <h:body styleClass="sierra-shell">
        <main class="sierra-shell__content">
            <h1>Button</h1>
            <h:form>
                <appButton:appButton value="Save" icon="pi pi-check" type="button"/>
                <appButton:appButton value="Cancel" type="button" styleClass="ui-button-outlined"/>
                <appButton:appButton value="Delete" icon="pi pi-trash" type="button"
                                           styleClass="ui-button-danger"/>
                <appButton:appButton icon="pi pi-moon" title="Toggle theme" type="button"
                                           styleClass="ui-button-rounded"/>
            </h:form>
        </main>
    </h:body>
</html>
