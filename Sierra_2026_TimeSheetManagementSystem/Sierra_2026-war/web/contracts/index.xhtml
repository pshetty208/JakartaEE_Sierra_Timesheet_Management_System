<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:f="jakarta.faces.core"
                xmlns:h="jakarta.faces.html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:dataTable="jakarta.faces.composite/dataTable"
                template="/WEB-INF/templates/app-layout.xhtml">
    <ui:define name="metadata">
        <f:metadata>
            <f:viewAction action="#{contractBean.loadContracts}"
                          onPostback="false"/>
        </f:metadata>
    </ui:define>

    <ui:define name="title">#{msg['contracts.page.title']}</ui:define>

    <ui:define name="content">
        <h:outputStylesheet library="contracts" name="contracts.css"/>

        <section class="contract-overview" aria-labelledby="contract-overview-title">
            <header class="contract-overview__heading">
                <div>
                    <h1 id="contract-overview-title">#{msg['contracts.title']}</h1>
                    <p>#{msg['contracts.description']}</p>
                </div>
                <h:link outcome="/contracts/create"
                        styleClass="contract-overview__create"
                        rendered="#{featureAccess.createContract}">
                    <span class="pi pi-plus" aria-hidden="true"></span>
                    <span>#{msg['contracts.create']}</span>
                </h:link>
            </header>

            <h:panelGroup layout="block"
                          rendered="#{contractBean.contracts eq null}"
                          styleClass="contract-overview__unavailable">
                <span class="pi pi-exclamation-circle" aria-hidden="true"></span>
                <div>
                    <h2>#{msg['contracts.unavailable.title']}</h2>
                    <p>#{msg['contracts.unavailable.description']}</p>
                </div>
            </h:panelGroup>

            <ui:fragment rendered="#{contractBean.contracts ne null}">
                <h:form id="contractsForm" styleClass="contract-overview__card">
                    <dataTable:dataTable value="#{contractBean.contracts}"
                                         rowKey="#{row.id}"
                                         rows="8"
                                         emptyMessage="#{msg['contracts.empty']}"
                                         styleClass="app-data-table contract-overview__table">
                        <p:column headerText="#{msg['contract.label']}"
                                  styleClass="contract-overview__column--contract">
                            <h:outputText value="#{row.name}" styleClass="contract-overview__name"/>
                        </p:column>

                        <p:column headerText="#{msg['common.status']}"
                                  styleClass="contract-overview__column--status">
                            <span class="contract-overview__status #{contractBean.statusStyleClass(row.status)}">
                                <h:outputText value="#{contractBean.statusLabel(row.status)}"/>
                            </span>
                        </p:column>

                        <p:column headerText="#{msg['contract.employee']}"
                                  styleClass="contract-overview__column--person">
                            <h:outputText value="#{row.employeeName}"/>
                        </p:column>

                        <p:column headerText="#{msg['contract.supervisor']}"
                                  styleClass="contract-overview__column--person">
                            <h:outputText value="#{row.supervisorName}"/>
                        </p:column>

                        <p:column headerText="#{msg['common.period']}"
                                  styleClass="contract-overview__column--period">
                            <span class="contract-overview__period">
                                <h:outputText value="#{row.startDate}">
                                    <f:convertDateTime type="localDate" pattern="dd.MM.yyyy"/>
                                </h:outputText>
                                <span aria-hidden="true">–</span>
                                <h:outputText value="#{row.endDate}">
                                    <f:convertDateTime type="localDate" pattern="dd.MM.yyyy"/>
                                </h:outputText>
                            </span>
                        </p:column>

                        <p:column headerText="#{msg['contract.frequency']}">
                            <h:outputText value="#{contractBean.frequencyLabel(row.frequency)}"/>
                        </p:column>

                        <p:column headerText="#{msg['contract.hoursPerWeek.short']}">
                            <h:outputText value="#{row.hoursPerWeek}"/>
                        </p:column>

                        <p:column headerText="#{msg['common.actions']}" styleClass="contract-overview__column--actions">
                            <div class="contract-overview__actions">
                                <h:link value="#{msg['contracts.viewDetails']}" outcome="/contracts/detail"
                                        styleClass="contract-overview__action">
                                    <f:param name="id" value="#{row.id}"/>
                                </h:link>
                                <h:link value="#{msg['common.edit']}" outcome="/contracts/edit"
                                        styleClass="contract-overview__action"
                                        rendered="#{(request.isUserInRole('SUPERVISOR') or request.isUserInRole('ASSISTANT')) and contractBean.isPrepared(row)}">
                                    <f:param name="id" value="#{row.id}"/>
                                </h:link>
                                <p:commandLink value="#{msg['common.delete']}"
                                               action="#{contractBean.delete(row.id)}"
                                               process="@this"
                                               update="contractsForm"
                                               styleClass="contract-overview__action"
                                               rendered="#{(request.isUserInRole('SUPERVISOR') or request.isUserInRole('ASSISTANT')) and contractBean.isPrepared(row)}">
                                    <p:confirm header="#{msg['contract.delete.confirm.title']}"
                                               message="#{msg['contract.delete.confirm.description']}"
                                               icon="pi pi-exclamation-triangle"/>
                                </p:commandLink>
                            </div>
                        </p:column>

                    </dataTable:dataTable>

                    <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                        <p:commandButton value="#{msg['common.cancel']}"
                                         type="button"
                                         icon="pi pi-times"
                                         styleClass="ui-confirmdialog-no p-button-outlined"/>
                        <p:commandButton value="#{msg['common.confirm']}"
                                         type="button"
                                         icon="pi pi-check"
                                         styleClass="ui-confirmdialog-yes"/>
                    </p:confirmDialog>
                </h:form>
            </ui:fragment>
        </section>
    </ui:define>
</ui:composition>
