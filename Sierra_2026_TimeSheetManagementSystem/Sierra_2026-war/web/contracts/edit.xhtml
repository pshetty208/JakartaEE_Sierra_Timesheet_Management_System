<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:f="jakarta.faces.core"
                xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:appButton="jakarta.faces.composite/appButton"
                xmlns:ui="jakarta.faces.facelets"
                template="/WEB-INF/templates/app-layout.xhtml">
    <ui:define name="metadata">
        <f:metadata>
            <f:viewParam id="contractId"
                         name="id"
                         value="#{contractBean.contractDetailId}"
                         required="true"
                         requiredMessage="#{msg['contract.validation.id.required']}"
                         converterMessage="#{msg['contract.validation.id.number']}"
                         validatorMessage="#{msg['contract.validation.id.positive']}">
                <f:validateLongRange minimum="1"/>
            </f:viewParam>
            <f:viewAction action="#{contractBean.loadContractDetails}"
                          if="#{not empty param.id}"
                          onPostback="false"/>
        </f:metadata>
    </ui:define>

    <ui:define name="title">#{msg['contract.edit.page.title']}</ui:define>

    <ui:define name="content">
        <h:outputStylesheet library="contracts" name="contracts.css"/>

        <section class="contract-create" aria-labelledby="contract-edit-title">
            <header class="contract-create__heading">
                <h:link outcome="/contracts/index"
                        styleClass="contract-create__back"
                        aria-label="#{msg['common.back']}">
                    <span class="pi pi-arrow-left" aria-hidden="true"></span>
                </h:link>

                <div>
                    <h1 id="contract-edit-title">#{msg['contract.edit.title']}</h1>
                    <p>#{msg['contract.edit.description']}</p>
                </div>
            </header>

            <h:form id="editContractForm" styleClass="contract-create__card"
                    rendered="#{contractBean.contract ne null}">
                <p:messages showDetail="false" closable="true"/>

                <div class="contract-create__grid">
                    <div class="contract-create__field contract-create__field--wide">
                        <p:outputLabel for="contractName" value="#{msg['contract.name']}"/>
                        <p:inputText id="contractName"
                                     value="#{contractBean.contract.name}"
                                     required="true"
                                     requiredMessage="#{msg['contract.validation.name.required']}"
                                     validatorMessage="#{msg['contract.validation.name.invalid']}">
                            <f:validateLength maximum="100"/>
                            <f:validateRegex pattern=".*\S.*"/>
                        </p:inputText>
                        <p:message for="contractName"/>
                    </div>

                    <div class="contract-create__field">
                        <p:outputLabel for="employee" value="#{msg['contract.employee']}"/>
                        <p:selectOneMenu id="employee"
                                         value="#{contractBean.contract.employeeId}"
                                         panelStyleClass="contract-create__select-panel">
                            <f:selectItem itemLabel="#{msg['contract.create.employee.placeholder']}"
                                          itemValue="#{null}"
                                          noSelectionOption="true"/>
                            <f:selectItems value="#{contractBean.employees}" var="person"
                                           itemValue="#{person.id}"
                                           itemLabel="#{person.firstName} #{person.lastName}"/>
                        </p:selectOneMenu>
                    </div>

                    <div class="contract-create__field">
                        <p:outputLabel for="supervisor" value="#{msg['contract.supervisor']}"/>
                        <p:selectOneMenu id="supervisor"
                                         value="#{contractBean.contract.supervisorId}"
                                         panelStyleClass="contract-create__select-panel">
                            <f:selectItem itemLabel="#{msg['contract.create.supervisor.placeholder']}"
                                          itemValue="#{null}"
                                          noSelectionOption="true"/>
                            <f:selectItems value="#{contractBean.supervisors}" var="person"
                                           itemValue="#{person.id}"
                                           itemLabel="#{person.firstName} #{person.lastName}"/>
                        </p:selectOneMenu>
                    </div>

                    <div class="contract-create__field">
                        <p:outputLabel for="startDate" value="#{msg['contract.startDate.first']}"/>
                        <p:datePicker id="startDate"
                                      value="#{contractBean.contract.startDate}"
                                      placeholder="dd.mm.yyyy"
                                      pattern="dd.MM.yyyy"
                                      showIcon="true"
                                      panelStyleClass="contract-create__date-panel"
                                      required="true"
                                      requiredMessage="#{msg['contract.validation.startDate.required']}"
                                      converterMessage="#{msg['contract.validation.startDate.format']}"/>
                        <p:message for="startDate"/>
                    </div>

                    <div class="contract-create__field">
                        <p:outputLabel for="endDate" value="#{msg['contract.endDate.last']}"/>
                        <p:datePicker id="endDate"
                                      value="#{contractBean.contract.endDate}"
                                      placeholder="dd.mm.yyyy"
                                      pattern="dd.MM.yyyy"
                                      showIcon="true"
                                      panelStyleClass="contract-create__date-panel"
                                      required="true"
                                      requiredMessage="#{msg['contract.validation.endDate.required']}"
                                      converterMessage="#{msg['contract.validation.endDate.format']}"/>
                        <p:message for="endDate"/>
                    </div>

                    <div class="contract-create__field">
                        <p:outputLabel for="frequency" value="#{msg['contract.frequency']}"/>
                        <p:selectOneMenu id="frequency"
                                         panelStyleClass="contract-create__select-panel"
                                         value="#{contractBean.contract.frequency}"
                                         required="true"
                                         requiredMessage="#{msg['contract.validation.frequency.required']}">
                            <f:selectItem itemLabel="#{msg['contract.create.frequency.placeholder']}"
                                          itemValue="#{null}"
                                          noSelectionOption="true"/>
                            <f:selectItems value="#{contractBean.frequencies}"
                                           var="frequency"
                                           itemLabel="#{contractBean.frequencyLabel(frequency)}"
                                           itemValue="#{frequency}"/>
                        </p:selectOneMenu>
                        <p:message for="frequency"/>
                    </div>

                    <div class="contract-create__field">
                        <p:outputLabel for="hoursPerWeek" value="#{msg['contract.hoursPerWeek']}"/>
                        <p:inputNumber id="hoursPerWeek"
                                       value="#{contractBean.contract.hoursPerWeek}"
                                       decimalPlaces="1"
                                       minValue="0.1"
                                       required="true"
                                       requiredMessage="#{msg['contract.validation.hours.required']}"
                                       validatorMessage="#{msg['contract.validation.hours.nonnegative']}">
                            <f:validateDoubleRange minimum="0.1"/>
                        </p:inputNumber>
                        <p:message for="hoursPerWeek"/>
                    </div>

                    <div class="contract-create__field">
                        <p:outputLabel for="workingDays" value="#{msg['contract.workingDaysPerWeek']}"/>
                        <p:inputNumber id="workingDays"
                                       value="#{contractBean.contract.workingDaysPerWeek}"
                                       decimalPlaces="0"
                                       minValue="1"
                                       maxValue="7"
                                       required="true"
                                       requiredMessage="#{msg['contract.validation.workingDays.required']}"
                                       validatorMessage="#{msg['contract.validation.workingDays.range']}">
                            <f:validateLongRange minimum="1" maximum="7"/>
                        </p:inputNumber>
                        <p:message for="workingDays"/>
                    </div>

                    <div class="contract-create__field">
                        <p:outputLabel for="vacationDays" value="#{msg['contract.vacationDaysPerYear']}"/>
                        <p:inputNumber id="vacationDays"
                                       value="#{contractBean.contract.vacationDaysPerYear}"
                                       decimalPlaces="0"
                                       minValue="0"
                                       required="true"
                                       requiredMessage="#{msg['contract.validation.vacationDays.required']}"
                                       validatorMessage="#{msg['contract.validation.vacationDays.nonnegative']}">
                            <f:validateLongRange minimum="0"/>
                        </p:inputNumber>
                        <p:message for="vacationDays"/>
                    </div>
                </div>

                <div class="contract-create__actions">
                    <appButton:appButton value="#{msg['common.cancel']}"
                                               outcome="/contracts/index"
                                               styleClass="ui-button-outlined contract-create__button"/>
                    <h:commandButton value="#{msg['contract.edit.save']}"
                                     action="#{contractBean.updateAndReturn}"
                                     styleClass="ui-button contract-create__button"/>
                </div>
            </h:form>
        </section>
    </ui:define>
</ui:composition>
