<?xml version='1.0' encoding='UTF-8' ?>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:cc="jakarta.faces.composite"
      xmlns:h="jakarta.faces.html">
    <cc:interface>
        <cc:attribute name="styleClass" default="sierra-headerbar"/>
        <cc:facet name="start"/>
        <cc:facet name="end"/>
    </cc:interface>

    <cc:implementation>
        <h:outputStylesheet library="headerbar" name="headerbar.css"/>

        <header class="#{cc.attrs.styleClass}">
            <div class="sierra-headerbar__content">
                <div class="sierra-headerbar__start">
                    <cc:renderFacet name="start"/>
                </div>

                <div class="sierra-headerbar__end">
                    <cc:renderFacet name="end"/>
                </div>
            </div>
        </header>
    </cc:implementation>
</html>
