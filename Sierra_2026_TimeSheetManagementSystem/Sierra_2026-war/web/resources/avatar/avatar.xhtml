<?xml version='1.0' encoding='UTF-8' ?>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:cc="jakarta.faces.composite"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui">
    <cc:interface>
        <cc:attribute name="label"/>
        <cc:attribute name="icon"/>
        <cc:attribute name="size"/>
        <cc:attribute name="shape"/>
        <cc:attribute name="style"/>
        <cc:attribute name="styleClass"/>
        <cc:attribute name="title"/>
        <cc:attribute name="dynamicColor" default="false"/>
        <cc:attribute name="lightness"/>
        <cc:attribute name="gravatar"/>
        <cc:attribute name="gravatarConfig"/>
    </cc:interface>

    <cc:implementation>
        <h:outputStylesheet library="avatar" name="avatar.css"/>

        <p:avatar label="#{cc.attrs.label}"
                  icon="#{cc.attrs.icon}"
                  size="#{cc.attrs.size}"
                  shape="#{cc.attrs.shape}"
                  style="#{cc.attrs.style}"
                  styleClass="#{cc.attrs.styleClass}"
                  title="#{cc.attrs.title}"
                  dynamicColor="#{cc.attrs.dynamicColor}"
                  lightness="#{cc.attrs.lightness}"
                  gravatar="#{cc.attrs.gravatar}"
                  gravatarConfig="#{cc.attrs.gravatarConfig}">
            <cc:insertChildren/>
        </p:avatar>
    </cc:implementation>
</html>
