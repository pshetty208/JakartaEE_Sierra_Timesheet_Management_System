<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="jakarta.faces.core"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:headerbar="jakarta.faces.composite/headerbar"
      xmlns:languageSwitcher="jakarta.faces.composite/languageSwitcher"
      xmlns:menu="jakarta.faces.composite/menu"
      xmlns:themeSwitcher="jakarta.faces.composite/themeSwitcher"
      xmlns:userProfileMenu="jakarta.faces.composite/userProfileMenu">
    <f:view locale="#{localeBean.locale}">
    <f:loadBundle basename="sierra.tms.i18n.messages" var="msg"/>
    <ui:insert name="metadata"/>

    <h:head>
        <title><ui:insert name="title">#{msg['page.title']}</ui:insert></title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <h:outputStylesheet library="appTheme" name="appTheme.css"/>
        <h:outputStylesheet library="appLayout" name="appLayout.css"/>
        <h:outputScript library="appTheme" name="appTheme.js" target="head"/>
    </h:head>

    <h:body styleClass="sierra-shell">
        <h:form id="headerForm" styleClass="sierra-headerbar__form sierra-shell__header">
            <headerbar:headerbar styleClass="sierra-headerbar">
                <f:facet name="start">
                    <ui:insert name="headerStart">
                        <h:link outcome="/app/dashboard" styleClass="sierra-shell__brand">
                            <span class="pi pi-clock sierra-shell__brand-icon" aria-hidden="true"></span>
                            <span>TSS</span>
                        </h:link>
                    </ui:insert>
                </f:facet>

                <f:facet name="end">
                    <ui:insert name="headerEnd">
                        <div class="sierra-headerbar__actions">
                            <languageSwitcher:languageSwitcher condensed="false"/>
                            <themeSwitcher:themeSwitcher lightLabel="#{msg['theme.useLight']}"
                                                           darkLabel="#{msg['theme.useDark']}"/>
                            <userProfileMenu:userProfileMenu name="#{currentPersonBean.displayName}"
                                                             label="#{currentPersonBean.initials}">
                                <p:menuitem value="#{msg['session.logout']}"
                                            icon="pi pi-sign-out"
                                            action="#{currentPersonBean.logout}"
                                            ajax="false"/>
                            </userProfileMenu:userProfileMenu>
                        </div>
                    </ui:insert>
                </f:facet>
            </headerbar:headerbar>
        </h:form>

        <div class="sierra-shell__body">
            <aside class="sierra-shell__navigation" aria-label="#{msg['navigation.primary']}">
                <ui:insert name="navigation">
                    <h:form id="navigationForm">
                        <span class="sierra-shell__navigation-label">#{msg['navigation.workspace']}</span>
                        <menu:menu styleClass="sierra-menu sierra-shell__navigation-menu">
                            <p:menuitem value="#{msg['navigation.dashboard']}"
                                        outcome="/app/dashboard"
                                        icon="pi pi-th-large"
                                        styleClass="#{facesContext.viewRoot.viewId eq '/app/dashboard.xhtml' ? 'sierra-shell__navigation-item--active' : ''}"/>
                            <p:menuitem value="#{msg['navigation.contracts']}"
                                        outcome="/contracts/index"
                                        icon="pi pi-file"
                                        rendered="#{featureAccess.viewContract}"
                                        styleClass="#{facesContext.viewRoot.viewId.startsWith('/contracts/') ? 'sierra-shell__navigation-item--active' : ''}"/>
                            <p:menuitem value="#{msg['navigation.timesheets']}"
                                        outcome="/app/timesheets"
                                        icon="pi pi-clock"
                                        rendered="#{featureAccess.viewTimesheets}"
                                        styleClass="#{facesContext.viewRoot.viewId eq '/app/timesheets.xhtml' ? 'sierra-shell__navigation-item--active' : ''}"/>
                            <p:menuitem value="#{msg['navigation.statistics']}"
                                        outcome="/app/statistics"
                                        icon="pi pi-chart-bar"
                                        rendered="#{featureAccess.viewStatistics}"
                                        styleClass="#{facesContext.viewRoot.viewId eq '/app/statistics.xhtml' ? 'sierra-shell__navigation-item--active' : ''}"/>
                        </menu:menu>
                    </h:form>
                </ui:insert>
            </aside>

            <main class="sierra-shell__content" id="main-content">
                <ui:insert name="content"/>
            </main>
        </div>
    </h:body>
    </f:view>
</html>
