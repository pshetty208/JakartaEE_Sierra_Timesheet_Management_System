<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:dashboardMetric="jakarta.faces.composite/dashboardMetric">
    <section class="dashboard" aria-labelledby="dashboard-title">
        <header class="dashboard__heading">
            <div>
                <span class="dashboard__eyebrow">#{msg['dashboard.secretary.eyebrow']}</span>
                <h1 id="dashboard-title">#{msg['dashboard.secretary.title']}</h1>
                <p>#{msg['dashboard.secretary.description']}</p>
            </div>
            <h:link outcome="/app/timesheets" styleClass="dashboard__heading-action">
                <span class="pi pi-inbox" aria-hidden="true"></span>
                <span>#{msg['dashboard.secretary.action']}</span>
            </h:link>
        </header>

        <div class="dashboard__metrics">
            <dashboardMetric:dashboardMetric label="#{msg['dashboard.secretary.metric.ready']}"
                                             value="#{dashboardBean.approvedCount}"
                                             icon="pi pi-inbox" tone="accent"/>
            <dashboardMetric:dashboardMetric label="#{msg['dashboard.secretary.metric.archived']}"
                                             value="#{dashboardBean.archivedCount}"
                                             icon="pi pi-folder" tone="positive"/>
            <dashboardMetric:dashboardMetric label="#{msg['dashboard.metric.contracts']}"
                                             value="#{dashboardBean.activeContractCount}"
                                             icon="pi pi-file"/>
            <dashboardMetric:dashboardMetric label="#{msg['dashboard.secretary.metric.terminated']}"
                                             value="#{dashboardBean.terminatedContractCount}"
                                             icon="pi pi-calendar-times"/>
        </div>

        <ui:include src="/WEB-INF/dashboard/timesheet-panel.xhtml">
            <ui:param name="panelId" value="secretary-ready-title"/>
            <ui:param name="title" value="#{msg['dashboard.secretary.ready.title']}"/>
            <ui:param name="description" value="#{msg['dashboard.secretary.ready.description']}"/>
            <ui:param name="rows" value="#{dashboardBean.readyToArchiveTimesheets}"/>
            <ui:param name="count" value="#{dashboardBean.approvedCount}"/>
            <ui:param name="showCount" value="true"/>
            <ui:param name="showEmployee" value="true"/>
            <ui:param name="showApproved" value="true"/>
            <ui:param name="actionLabel" value="#{msg['dashboard.open']}"/>
            <ui:param name="actionIcon" value="pi pi-arrow-right"/>
            <ui:param name="emptyIcon" value="pi pi-check-circle"/>
            <ui:param name="emptyTitle" value="#{msg['dashboard.secretary.ready.empty.title']}"/>
            <ui:param name="emptyDescription" value="#{msg['dashboard.secretary.ready.empty.description']}"/>
        </ui:include>

        <ui:include src="/WEB-INF/dashboard/timesheet-panel.xhtml">
            <ui:param name="panelId" value="secretary-archived-title"/>
            <ui:param name="title" value="#{msg['dashboard.secretary.archived.title']}"/>
            <ui:param name="description" value="#{msg['dashboard.secretary.archived.description']}"/>
            <ui:param name="rows" value="#{dashboardBean.archivedTimesheets}"/>
            <ui:param name="showEmployee" value="true"/>
            <ui:param name="showApproved" value="true"/>
            <ui:param name="showStatus" value="true"/>
            <ui:param name="emptyIcon" value="pi pi-folder-open"/>
            <ui:param name="emptyTitle" value="#{msg['dashboard.secretary.archived.empty.title']}"/>
            <ui:param name="emptyDescription" value="#{msg['dashboard.secretary.archived.empty.description']}"/>
        </ui:include>
    </section>
</ui:composition>
